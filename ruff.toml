# Exclude a variety of commonly ignored directories.
exclude = [
    ".pyi",
    "snmp-mibs",
    "tests/test_scripts",
]

# Set the maximum line length to 100.
line-length = 100
indent-width = 4

[lint]
extend-select = [
    "N",  # pep8-naming
    # "D",  # pydocstyle (can use this later but for now causes too many errors)
    "I",  # isort (for imports)
    "E501",  # Line too long ({width} > {limit})
    "E",
    "F",
    "ANN",
]
ignore = [
    "D406",  # Section name should end with a newline ("{name}")
    "D407",  # Missing dashed underline after section ("{name}")
    "N999",  # Ignore this because the repo itself would need to be renamed
    "ANN401", # explicit ANY type is allowed
    "BLE001", # Common pattern throughout this package
    "B017", # Common pattern throughout this package
    "S110", # Common pattern throughout this package
]
[lint.per-file-ignores]
"tests/*" = [
    "N802",
    "D100",
    "D101",
    "D102",
    "E501",
    "ANN",
]
"*.pyi" = [  # auto-generated type-stubs, don't lint these
    "ANN",
    "N",
    "D",
    "E",
    "F",
    "PYI"
]

[lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
